<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Knowledge Platform</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}header{background:#173b68;color:#fff;padding:20px 7%;display:flex;justify-content:space-between}main{max-width:1050px;margin:25px auto;padding:0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;padding:20px;margin-bottom:18px;border-radius:12px;box-shadow:0 2px 10px #0001}input,select,button{padding:11px;margin:5px 0;border-radius:7px;border:1px solid #ccd5e0}input{width:100%;box-sizing:border-box}button{background:#173b68;color:#fff;border:0;cursor:pointer}.hidden{display:none}.result{padding:12px;border:1px solid #ddd;border-radius:7px;margin:8px 0}.muted{color:#64748b;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header><b>Enterprise Knowledge Management & AI Search</b><button id="out" class="hidden" onclick="logout()">Logout</button></header><main><div id="auth" class="grid"><div class="card"><h2>Login</h2><input id="le" placeholder="Email"><input id="lp" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="lm" class="muted"></p></div><div class="card"><h2>Register</h2><input id="rn" placeholder="Name"><input id="re" placeholder="Email"><input id="rp" type="password" placeholder="Password"><select id="rr"><option>Employee</option><option>Administrator</option><option>Knowledge Manager</option><option>Department Manager</option><option>IT Team</option></select><button onclick="register()">Create Account</button><p id="rm" class="muted"></p></div></div><div id="app" class="hidden"><div class="card"><h2 id="welcome"></h2></div><div class="card"><h2>Upload Document</h2><input id="file" type="file" accept=".txt,.pdf,.docx"><input id="cat" placeholder="Category"><button onclick="upload()">Upload</button><p id="um" class="muted"></p></div><div class="card"><h2>AI-Powered Search</h2><input id="q" placeholder="Search documents..."><button onclick="searchDocs()">Search</button><div id="results"></div></div><div class="card"><h2>Documents</h2><button onclick="loadDocs()">Refresh</button><div id="docs"></div></div></div></main><script>const API='http://localhost:8000';let t=localStorage.getItem('token');const H=()=>({Authorization:'Bearer '+t});function ui(){auth.classList.toggle('hidden',!!t);app.classList.toggle('hidden',!t);out.classList.toggle('hidden',!t);if(t)me()}async function register(){let r=await fetch(API+'/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:rn.value,email:re.value,password:rp.value,role:rr.value})});let d=await r.json();rm.textContent=d.message||d.detail}async function login(){let r=await fetch(API+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:le.value,password:lp.value})});let d=await r.json();if(r.ok){t=d.access_token;localStorage.setItem('token',t);ui()}else lm.textContent=d.detail}async function me(){let r=await fetch(API+'/api/me',{headers:H()});if(!r.ok)return logout();let d=await r.json();welcome.textContent='Welcome, '+d.name+' ('+d.role+')';loadDocs()}async function upload(){let f=file.files[0];if(!f)return;let fd=new FormData();fd.append('file',f);fd.append('category',cat.value||'General');let r=await fetch(API+'/api/documents/upload',{method:'POST',headers:H(),body:fd});let d=await r.json();um.textContent=d.message||d.detail;loadDocs()}async function searchDocs(){let r=await fetch(API+'/api/search?q='+encodeURIComponent(q.value),{headers:H()});let a=await r.json();results.innerHTML=a.length?a.map(x=>'<div class=result><b>'+x.title+'</b><br><span class=muted>'+x.filename+' · '+x.category+' · relevance '+x.score+'%</span><br><button onclick="download('+x.id+')">Download</button></div>').join(''):'<p class=muted>No relevant documents found.</p>'}async function loadDocs(){let r=await fetch(API+'/api/documents',{headers:H()});let a=await r.json();docs.innerHTML=a.map(x=>'<div class=result><b>'+x.title+'</b><br><span class=muted>'+x.filename+' · '+x.category+'</span><br><button onclick="download('+x.id+')">Download</button></div>').join('')||'<p class=muted>No documents yet.</p>'}async function download(id){let r=await fetch(API+'/api/documents/'+id+'/download',{headers:H()});let b=await r.blob();let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='document';a.click()}function logout(){localStorage.removeItem('token');t=null;ui()}ui();</script></body></html>
