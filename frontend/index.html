<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Enterprise Knowledge Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f7fb;
            color: #172033;
        }

        header {
            background: #173b68;
            color: #ffffff;
            padding: 22px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 2px 10px #0001;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        input,
        select,
        button {
            padding: 11px;
            border: 1px solid #ccd5e0;
            border-radius: 7px;
            margin: 5px 0;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
        }

        button {
            background: #173b68;
            color: #ffffff;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #0f2c50;
        }

        .hidden {
            display: none;
        }

        .result {
            border: 1px solid #e2e8f0;
            padding: 14px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .muted {
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 700px) {
            .grid {
                grid-template-columns: 1fr;
            }

            header {
                padding: 18px 5%;
            }

            header h1 {
                font-size: 20px;
            }

            main {
                margin: 20px auto;
                padding: 0 15px;
            }
        }
    </style>

    <!-- JavaScript Files -->
    <script src="/services/api.js"></script>
    <script src="/components/auth.js"></script>
    <script src="/components/documents.js"></script>
    <script src="/pages/dashboard.js"></script>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Enterprise Knowledge Management &amp; AI Search</h1>

        <button
            id="logoutBtn"
            class="hidden"
            onclick="logoutUser()">
            Logout
        </button>
    </header>

    <!-- Main Content -->
    <main>

        <!-- Authentication Section -->
        <div id="auth" class="grid">

            <!-- Login -->
            <section class="card">
                <h2>Login</h2>

                <input
                    id="loginEmail"
                    type="email"
                    placeholder="Email">

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Password">

                <button onclick="loginUser()">
                    Login
                </button>

                <p
                    id="loginMsg"
                    class="muted">
                </p>
            </section>

            <!-- Registration -->
            <section class="card">
                <h2>Register</h2>

                <input
                    id="regName"
                    type="text"
                    placeholder="Name">

                <input
                    id="regEmail"
                    type="email"
                    placeholder="Email">

                <input
                    id="regPassword"
                    type="password"
                    placeholder="Password">

                <select id="regRole">
                    <option>Employee</option>
                    <option>Administrator</option>
                    <option>Knowledge Manager</option>
                    <option>Department Manager</option>
                    <option>IT Team</option>
                </select>

                <button onclick="registerUser()">
                    Create Account
                </button>

                <p
                    id="regMsg"
                    class="muted">
                </p>
            </section>

        </div>

        <!-- Application Section -->
        <div id="app" class="hidden">

            <!-- Welcome -->
            <section class="card">
                <h2 id="welcome"></h2>
            </section>

            <!-- Upload Document -->
            <section class="card">
                <h2>Upload Document</h2>

                <input
                    id="file"
                    type="file"
                    accept=".txt,.pdf,.docx">

                <input
                    id="category"
                    type="text"
                    placeholder="Category">

                <button onclick="uploadDocument()">
                    Upload
                </button>

                <p
                    id="uploadMsg"
                    class="muted">
                </p>
            </section>

            <!-- AI Search -->
            <section class="card">
                <h2>AI-Powered Search</h2>

                <input
                    id="query"
                    type="text"
                    placeholder="Search documents">

                <button onclick="searchDocumentsUI()">
                    Search
                </button>

                <div id="results"></div>
            </section>

            <!-- Documents -->
            <section class="card">
                <h2>Documents</h2>

                <button onclick="loadDocuments()">
                    Refresh
                </button>

                <div id="docs"></div>
            </section>

        </div>

    </main>

    <!-- Application Logic -->
    <script>
        function showApplication() {
            const isLoggedIn = !!localStorage.getItem("token");

            auth.classList.toggle("hidden", isLoggedIn);
            app.classList.toggle("hidden", !isLoggedIn);
            logoutBtn.classList.toggle("hidden", !isLoggedIn);

            if (isLoggedIn) {
                showDashboard();
            }
        }

        showApplication();
    </script>

</body>

</html>
